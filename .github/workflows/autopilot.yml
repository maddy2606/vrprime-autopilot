name: Autopilot

on:
  schedule:
    # Every 30 minutes from 8:12 AM to 10:42 PM India time (IST = UTC+5:30); paused 11 PM–8 AM.
    - cron: '42 2-16 * * *'   # 8:12 AM … 10:12 PM IST
    - cron: '12 3-17 * * *'   # 8:42 AM … 10:42 PM IST
  workflow_dispatch:          # "Run workflow" button
  push:
    branches: [main]
    paths: ['ads/latest.json', 'config.json']   # a new ads problem pushed from the Mac alerts right away

permissions:
  contents: write             # to save the budget page and state back to the repo

concurrency:
  group: autopilot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Activate listings, update budget page, email alerts
        run: node run.mjs
        env:
          FLIPKART_APP_ID: ${{ secrets.FLIPKART_APP_ID }}
          FLIPKART_APP_SECRET: ${{ secrets.FLIPKART_APP_SECRET }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          PAGE_URL: ${{ vars.PAGE_URL }}
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
      - name: Save budget page and state
        if: always()
        run: |
          git config user.name "vrprime-autopilot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BUDGET.md docs/index.html state/state.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -q -m "Budget page update [skip ci]"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep $((i*3)); done
          exit 1
